slam_toolbox:
  ros__parameters:

    # ── Plugin & mode ──────────────────────────────────
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ── Frame ──────────────────────────────────────────
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    use_map_saver: true
    mode: mapping                  # ganti ke 'localization' setelah punya peta

    # ── Timing ─────────────────────────────────────────
    map_update_interval: 0.5       # detik, seberapa sering peta diupdate
    resolution: 0.05               # meter/pixel peta (5cm)
    max_laser_range: 8.0           # meter, sesuai RPLidar C1
    minimum_time_interval: 0.2     # detik antar scan yang diproses

    # ── Loop closure ───────────────────────────────────
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.1   # meter, minimal gerak sebelum update
    minimum_travel_heading: 0.1    # radian (~5.7°)
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.45
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true

    # ── TF & odometry ──────────────────────────────────
    tf_buffer_duration: 30.0
    position_covariance_scale: 1.0
    yaw_covariance_scale: 1.0
    map_start_at_dock: false